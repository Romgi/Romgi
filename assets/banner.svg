<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">Jonathan Graydon — software, systems, and robotics</title>
  <desc id="desc">A dark technical banner with a cyan route diagram. Computer Science at McMaster University. Based in Toronto.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1b2837" stroke-width="0.7"/></pattern>
    <clipPath id="round"><rect width="960" height="280" rx="16"/></clipPath>
  </defs>
  <style>
    .label{font-family:Consolas,'Liberation Mono',monospace;font-size:12px;letter-spacing:1.5px}
    .flow{animation:flow 4s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-40}}
    @media(prefers-reduced-motion:reduce){.flow{animation:none}}
  </style>
  <g clip-path="url(#round)">
    <rect width="960" height="280" fill="#0d1117"/>
    <rect x="648" width="312" height="280" fill="url(#grid)"/>
    <path d="M648 0V280" stroke="#263241"/>
    <path d="M0 0H960" stroke="#67e8f9" stroke-width="4"/>
    <text x="40" y="46" class="label" fill="#67e8f9">SOFTWARE / SYSTEMS / ROBOTICS</text>
    <text x="38" y="121" font-family="'Segoe UI',Arial,sans-serif" font-size="52" font-weight="700" letter-spacing="-2" fill="#f0f6fc">Jonathan Graydon</text>
    <text x="40" y="161" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#b3c2d5">Useful tools. Interactive systems. Real-world code.</text>
    <path d="M40 197H608" stroke="#263241"/>
    <circle cx="45" cy="232" r="4" fill="#a7f3d0"/>
    <text x="60" y="237" class="label" fill="#9baac1">McMASTER CS</text>
    <text x="252" y="237" class="label" fill="#9baac1">TORONTO, CANADA</text>
    <text x="508" y="237" class="label" fill="#67e8f9">@ROMGI</text>
    <text x="676" y="46" class="label" fill="#7a90a9">IDEA → IMPLEMENTATION</text>
    <g fill="none" stroke="#2a4255" stroke-width="1.5">
      <path d="M696 96H744L792 144H888M696 96V192H792L840 240H912"/>
      <path d="M696 144H744L792 96H888V192H840L792 144V240"/>
      <path d="M744 72V216M864 72V240" stroke-dasharray="3 6"/>
    </g>
    <path d="M696 192H744L792 144H840L888 96" fill="none" stroke="#67e8f9" stroke-width="3"/>
    <path class="flow" d="M696 192H744L792 144H840L888 96" fill="none" stroke="#f0f6fc" stroke-width="3" stroke-dasharray="3 17"/>
    <g fill="#0d1117" stroke="#67e8f9" stroke-width="2">
      <circle cx="696" cy="192" r="6"/><circle cx="792" cy="144" r="6"/>
      <rect x="881" y="89" width="14" height="14" rx="2" fill="#a7f3d0" stroke="#a7f3d0"/>
    </g>
    <g fill="#496078"><circle cx="696" cy="96" r="3"/><circle cx="792" cy="96" r="3"/><circle cx="888" cy="144" r="3"/><circle cx="888" cy="192" r="3"/><circle cx="792" cy="240" r="3"/></g>
    <text x="677" y="258" class="label" font-size="10" fill="#7a90a9">BUILD → TEST → ITERATE</text>
  </g>
  <rect x="0.5" y="0.5" width="959" height="279" rx="15.5" fill="none" stroke="#263241"/>
</svg>
